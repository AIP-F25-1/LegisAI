services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legisai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - PORT=8000
      - COURTLISTENER_API_TOKEN=${COURTLISTENER_API_TOKEN:-}
    volumes:
      # Persist vector store data
      - ./data:/app/data
      # Persist uploaded documents
      - ./uploads:/app/uploads
      # Persist legal data (optional, can be read-only)
      - ./legal_data:/app/legal_data:ro
    depends_on:
      - ollama
    networks:
      - legisai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: legisai-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist Ollama models
      - ollama-data:/root/.ollama
    networks:
      - legisai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: legisai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - legisai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama-data:
    driver: local

networks:
  legisai-network:
    driver: bridge

